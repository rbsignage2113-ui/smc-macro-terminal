<script>
    let activeRange = 'today';

    function setRangeUI(range) {
        activeRange = range;
        ['today', 'this_week', 'this_month'].forEach(r => {
            const btn = document.getElementById(`btn-${r}`);
            if (btn) {
                if (r === range) {
                    btn.className = "px-2 py-1 rounded bg-yellow-500 text-slate-950 transition font-bold";
                } else {
                    btn.className = "px-2 py-1 rounded text-slate-400 hover:text-white transition font-bold";
                }
            }
        });
    }

    // Checking 30 mins post news expiry
    function isExpired(timestamp) {
        if (!timestamp) return false;
        const eventTime = new Date(timestamp).getTime();
        const now = new Date().getTime();
        if (isNaN(eventTime)) return false;
        const diffInMinutes = (now - eventTime) / (1000 * 60);
        return diffInMinutes > 30; // 30 mins over aana dhaan hide aagum
    }

    async function loadNews(range) {
        setRangeUI(range);
        const container = document.getElementById('news-desk-container');
        container.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">Analyzing ${range.replace('_', ' ').toUpperCase()} Calendar Data...</div>`;

        try {
            const res = await fetch(`/api/news-ai-bias?range=${range}`);
            const data = await res.json();
            
            container.innerHTML = '';

            const groupedNews = {};
            (data.raw_news || []).forEach(item => {
                // Ignore expiration if timestamp is not explicitly provided
                if (!item.timestamp || !isExpired(item.timestamp)) {
                    const curr = item.currency || item.country || 'USD';
                    if (!groupedNews[curr]) groupedNews[curr] = [];
                    groupedNews[curr].push(item);
                }
            });

            if (Object.keys(groupedNews).length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">No active high-impact events scheduled for this period.</div>`;
                return;
            }

            // Render Currency Groups
            Object.keys(groupedNews).forEach(curr => {
                const events = groupedNews[curr];
                const aiInfo = (data.ai_bias && data.ai_bias[curr]) ? data.ai_bias[curr] : {
                    signal: "BUY",
                    label: "PRE-NEWS BULLISH",
                    ict_note: "Forecast indicates momentum. Watch Killzone liquidity sweeps."
                };

                const badgeColor = aiInfo.signal === 'BUY' ? 'bg-green-500/20 text-green-400 border-green-500' : 
                                  (aiInfo.signal === 'SELL' ? 'bg-red-500/20 text-red-400 border-red-500' : 'bg-yellow-500/20 text-yellow-400 border-yellow-500');

                let eventsHTML = '';
                events.forEach(ev => {
                    eventsHTML += `
                        <div class="flex justify-between items-center text-xs py-1 border-b border-slate-800/50 last:border-0">
                            <div>
                                <p class="font-bold text-slate-300">[${curr}] ${ev.event}</p>
                                <p class="text-[10px] text-slate-400">PREV: <span class="text-slate-200">${ev.prev || '-'}</span> | FC: <span class="text-slate-200">${ev.estimate || '-'}</span></p>
                            </div>
                            <div class="text-right">
                                <span class="text-[10px] font-bold text-emerald-400 bg-emerald-950/60 px-1.5 py-0.5 rounded border border-emerald-800">ACT: ${ev.actual || 'WAITING...'}</span>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-black text-red-400 bg-red-950/40 px-2 py-0.5 rounded border border-red-800">${curr} HIGH IMPACT GROUP (${events.length} EVENTS)</span>
                            <span class="text-[10px] text-emerald-400 animate-pulse">● LIVE ACTIVE</span>
                        </div>

                        <div class="space-y-1 bg-slate-900/60 p-2 rounded-lg">
                            ${eventsHTML}
                        </div>

                        <!-- Combined AI Signal Box -->
                        <div class="p-2.5 bg-slate-900 rounded-lg border-l-4 border-yellow-500 space-y-1">
                            <div class="flex justify-between items-center">
                                <span class="text-[11px] font-bold text-yellow-400">🧠 OVERALL ${curr} COMBINED AI SIGNAL:</span>
                                <span class="text-[10px] font-black px-2 py-0.5 rounded border ${badgeColor}">${aiInfo.signal} (${aiInfo.label})</span>
                            </div>
                            <p class="text-[11px] text-slate-300 leading-snug">${aiInfo.ict_note}</p>
                        </div>
                    </div>
                `;
            });

        } catch (err) {
            console.error("UI Load Error:", err);
            container.innerHTML = `<div class="text-center py-10 text-red-400 text-xs">Failed to fetch AI news engine.</div>`;
        }
    }

    loadNews('today');
    setInterval(() => loadNews(activeRange), 60000);
</script>
