<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR-RIZQ TRADING TERMINAL - Perfectly Aligned Desk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        body { background-color: #060913; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        .cyber-card { 
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(9, 14, 26, 0.98) 100%);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        .tab-btn-active { background: linear-gradient(135deg, #d97706 0%, #b45309 100%) !important; color: #ffffff !important; font-weight: bold; }
        .curr-btn-active { background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%) !important; color: #ffffff !important; font-weight: bold; }
        .asset-btn-active { background: #0284c7 !important; color: #ffffff !important; font-weight: bold; }
    </style>
</head>
<body class="p-3 sm:p-5 space-y-4">

    <!-- Top Header Bar -->
    <header class="cyber-card p-3 rounded-xl flex flex-wrap justify-between items-center text-sm shadow-2xl gap-2">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 font-bold">AR</div>
            <div>
                <span class="font-bold text-base sm:text-lg text-cyan-400 tracking-wider">AR-RIZQ TERMINAL</span>
                <span class="block text-[10px] text-slate-400 font-mono">SYMMETRICAL INSTITUTIONAL DESK</span>
            </div>
            <span id="live-ist-clock" class="bg-slate-900 px-3 py-1 rounded-lg text-[10px] sm:text-xs text-emerald-400 font-mono border border-slate-800 ml-2">IN LIVE IST: --</span>
        </div>
        <div class="hidden md:flex items-center space-x-5 font-mono text-xs text-slate-300">
            <span>USDCAD: <strong class="text-white">1.4013</strong></span>
            <span>GBPUSD: <strong class="text-white">1.3040</strong></span>
            <span>USDJPY: <strong class="text-white">157.06</strong></span>
            <span>GOLD: <strong class="text-amber-400">$4,012.31</strong></span>
        </div>
        <div class="flex items-center space-x-2">
            <span class="px-3 py-1 bg-emerald-950/80 text-emerald-400 rounded-lg text-[10px] sm:text-xs font-semibold border border-emerald-800/60 animate-pulse">LONDON KILLZONE</span>
        </div>
    </header>

    <!-- MAIN DASHBOARD GRID -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 items-start">
        
        <!-- LEFT: Red Folder High Impact News Desk -->
        <div class="space-y-4">
            <div class="cyber-card p-4 rounded-xl space-y-3">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <h3 class="text-xs sm:text-sm font-bold text-red-400 uppercase flex items-center space-x-2">
                        <i class="fa-solid fa-shield-halved text-red-500"></i>
                        <span>RED FOLDER NEWS DESK</span>
                    </h3>
                    <div class="flex space-x-1 text-xs font-mono">
                        <button id="tab-today" onclick="setTimeRange('TODAY')" class="px-2 py-1 bg-slate-900 text-slate-300 rounded-lg font-bold border border-slate-800">TODAY</button>
                        <button id="tab-week" onclick="setTimeRange('THIS_WEEK')" class="px-2 py-1 bg-slate-900 text-slate-300 rounded-lg font-bold tab-btn-active">WEEK</button>
                        <button id="tab-month" onclick="setTimeRange('THIS_MONTH')" class="px-2 py-1 bg-slate-900 text-slate-300 rounded-lg font-bold border border-slate-800">MONTH</button>
                    </div>
                </div>

                <!-- Currency Filter Panel -->
                <div class="grid grid-cols-4 gap-1 text-xs font-mono bg-slate-950/80 p-2 rounded-xl border border-slate-800">
                    <button id="curr-ALL" onclick="filterCurrency('ALL')" class="py-1 rounded-lg curr-btn-active font-bold">ALL</button>
                    <button id="curr-USD" onclick="filterCurrency('USD')" class="py-1 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg font-bold border border-slate-800">USD</button>
                    <button id="curr-EUR" onclick="filterCurrency('EUR')" class="py-1 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg font-bold border border-slate-800">EUR</button>
                    <button id="curr-AUD" onclick="filterCurrency('AUD')" class="py-1 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg font-bold border border-slate-800">AUD</button>
                    <button id="curr-GBP" onclick="filterCurrency('GBP')" class="py-1 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg font-bold border border-slate-800">GBP</button>
                    <button id="curr-CAD" onclick="filterCurrency('CAD')" class="py-1 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg font-bold border border-slate-800">CAD</button>
                    <button id="curr-JPY" onclick="filterCurrency('JPY')" class="py-1 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg font-bold border border-slate-800">JPY</button>
                </div>

                <!-- Red Folder News Container -->
                <div id="red-folder-container" class="space-y-2.5 overflow-y-auto max-h-[500px] pr-1"></div>
            </div>
        </div>

        <!-- RIGHT: TRADINGVIEW CHART MATCHED TO NEWS BOX HEIGHT -->
        <div class="lg:col-span-2 space-y-4">
            <div class="cyber-card p-4 rounded-xl space-y-3">
                <div class="flex flex-wrap items-center justify-between border-b border-slate-800 pb-2.5 gap-2">
                    <div class="flex space-x-1.5 overflow-x-auto text-xs font-mono max-w-full pb-1">
                        <button id="asset-XAUUSD" onclick="loadTvChart('OANDA:XAUUSD', 'XAUUSD')" class="px-3 py-1 asset-btn-active rounded-lg text-xs">XAUUSD</button>
                        <button id="asset-EURUSD" onclick="loadTvChart('FX:EURUSD', 'EURUSD')" class="px-3 py-1 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-800 text-xs">EURUSD</button>
                        <button id="asset-GBPUSD" onclick="loadTvChart('FX:GBPUSD', 'GBPUSD')" class="px-3 py-1 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-800 text-xs">GBPUSD</button>
                        <button id="asset-USDJPY" onclick="loadTvChart('FX:USDJPY', 'USDJPY')" class="px-3 py-1 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-800 text-xs">USDJPY</button>
                        <button id="asset-AUDUSD" onclick="loadTvChart('FX:AUDUSD', 'AUDUSD')" class="px-3 py-1 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-800 text-xs">AUDUSD</button>
                        <button id="asset-USDCAD" onclick="loadTvChart('FX:USDCAD', 'USDCAD')" class="px-3 py-1 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-800 text-xs">USDCAD</button>
                    </div>
                    <span id="active-asset-title" class="text-xs font-mono text-cyan-400 font-bold px-2.5 py-1 bg-cyan-950/60 rounded-lg border border-cyan-800/40">XAUUSD</span>
                </div>
                
                <!-- Perfectly Matched Height -->
                <div class="h-[555px] w-full bg-slate-950 rounded-xl border border-slate-900 overflow-hidden" id="tv_chart_container"></div>
            </div>
        </div>

    </div>

    <!-- JavaScript Engine -->
    <script>
        const redFolderNews = [
            {
                id: 1,
                dateTimeISO: "2026-10-28T06:00:00+05:30",
                dateStr: "2026-10-28",
                displayDate: "Wed Oct 28",
                time: "06:00 AM",
                currency: "AUD",
                event: "CPI m/m, CPI y/y, Trimmed Mean CPI",
                forecast: "0.7% / 4.2%",
                previous: "0.4% / 4.0%",
                actual: "Pending"
            },
            {
                id: 2,
                dateTimeISO: "2026-10-28T18:00:00+05:30",
                dateStr: "2026-10-28",
                displayDate: "Wed Oct 28",
                time: "06:00 PM",
                currency: "GBP",
                event: "Annual Budget Release",
                forecast: "Pending",
                previous: "Pending",
                actual: "Pending"
            },
            {
                id: 3,
                dateTimeISO: "2026-10-28T19:15:00+05:30",
                dateStr: "2026-10-28",
                displayDate: "Wed Oct 28",
                time: "07:15 PM",
                currency: "CAD",
                event: "BOC Monetary Policy Report & Rate Statement",
                forecast: "Pending",
                previous: "Pending",
                actual: "Pending"
            },
            {
                id: 4,
                dateTimeISO: "2026-10-28T19:15:00+05:30",
                dateStr: "2026-10-28",
                displayDate: "Wed Oct 28",
                time: "07:15 PM",
                currency: "CAD",
                event: "Overnight Rate",
                forecast: "2.50%",
                previous: "2.25%",
                actual: "Pending"
            },
            {
                id: 5,
                dateTimeISO: "2026-10-28T20:00:00+05:30",
                dateStr: "2026-10-28",
                displayDate: "Wed Oct 28",
                time: "08:00 PM",
                currency: "CAD",
                event: "BOC Press Conference",
                forecast: "Pending",
                previous: "Pending",
                actual: "Pending"
            },
            {
                id: 6,
                dateTimeISO: "2026-10-28T23:30:00+05:30",
                dateStr: "2026-10-28",
                displayDate: "Wed Oct 28",
                time: "11:30 PM",
                currency: "USD",
                event: "Federal Funds Rate & FOMC Statement",
                forecast: "4.00%",
                previous: "4.00%",
                actual: "Pending"
            },
            {
                id: 7,
                dateTimeISO: "2026-10-29T00:00:00+05:30",
                dateStr: "2026-10-29",
                displayDate: "Thu Oct 29",
                time: "12:00 AM",
                currency: "USD",
                event: "FOMC Press Conference",
                forecast: "Pending",
                previous: "Pending",
                actual: "Pending"
            },
            {
                id: 8,
                dateTimeISO: "2026-10-29T18:00:00+05:30",
                dateStr: "2026-10-29",
                displayDate: "Thu Oct 29",
                time: "06:00 PM",
                currency: "USD",
                event: "Advance GDP q/q & Core PCE Price Index",
                forecast: "3.2% / 0.3%",
                previous: "2.2% / 0.2%",
                actual: "Pending"
            },
            {
                id: 9,
                dateTimeISO: "2026-10-29T18:45:00+05:30",
                dateStr: "2026-10-29",
                displayDate: "Thu Oct 29",
                time: "06:45 PM",
                currency: "EUR",
                event: "Main Refinancing Rate & Monetary Policy Statement",
                forecast: "2.65%",
                previous: "2.65%",
                actual: "Pending"
            },
            {
                id: 10,
                dateTimeISO: "2026-10-29T19:15:00+05:30",
                dateStr: "2026-10-29",
                displayDate: "Thu Oct 29",
                time: "07:15 PM",
                currency: "EUR",
                event: "ECB Press Conference",
                forecast: "Pending",
                previous: "Pending",
                actual: "Pending"
            },
            {
                id: 11,
                dateTimeISO: "2026-10-30T09:00:00+05:30",
                dateStr: "2026-10-30",
                displayDate: "Fri Oct 30",
                time: "Tentative",
                currency: "JPY",
                event: "BOJ Policy Rate, Outlook Report & Press Conference",
                forecast: "<1.25%",
                previous: "<1.25%",
                actual: "Pending"
            }
        ];

        let activeTimeRange = 'THIS_WEEK';
        let activeCurrency = 'ALL';

        function loadTvChart(symbol = 'OANDA:XAUUSD', pairName = 'XAUUSD') {
            const assetList = ['XAUUSD', 'EURUSD', 'GBPUSD', 'USDJPY', 'AUDUSD', 'USDCAD'];
            assetList.forEach(asset => {
                const btn = document.getElementById(`asset-${asset}`);
                if(btn) {
                    if(asset === pairName) {
                        btn.className = "px-3 py-1 asset-btn-active rounded-lg text-xs font-bold";
                    } else {
                        btn.className = "px-3 py-1 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-800 text-xs";
                    }
                }
            });

            document.getElementById('tv_chart_container').innerHTML = '';
            new TradingView.widget({
                "width": "100%",
                "height": "100%",
                "symbol": symbol,
                "interval": "15",
                "timezone": "Asia/Kolkata",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#060913",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "container_id": "tv_chart_container"
            });
            document.getElementById('active-asset-title').innerText = pairName;
        }

        function matchesTimeRange(news) {
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            const newsDate = new Date(news.dateTimeISO);

            if (activeTimeRange === 'TODAY') {
                return news.dateStr === todayStr;
            } else if (activeTimeRange === 'THIS_WEEK') {
                return true; 
            } else if (activeTimeRange === 'THIS_MONTH') {
                return newsDate.getMonth() === now.getMonth() && newsDate.getFullYear() === now.getFullYear();
            }
            return true;
        }

        function setTimeRange(range) {
            activeTimeRange = range;
            document.getElementById('tab-today').className = range === 'TODAY' ? 'px-2 py-1 rounded-lg font-bold tab-btn-active border border-amber-600/50' : 'px-2 py-1 bg-slate-900 text-slate-300 rounded-lg font-bold border border-slate-800';
            document.getElementById('tab-week').className = range === 'THIS_WEEK' ? 'px-2 py-1 rounded-lg font-bold tab-btn-active border border-amber-600/50' : 'px-2 py-1 bg-slate-900 text-slate-300 rounded-lg font-bold border border-slate-800';
            document.getElementById('tab-month').className = range === 'THIS_MONTH' ? 'px-2 py-1 rounded-lg font-bold tab-btn-active border border-amber-600/50' : 'px-2 py-1 bg-slate-900 text-slate-300 rounded-lg font-bold border border-slate-800';
            renderNews();
        }

        function filterCurrency(curr) {
            activeCurrency = curr;
            ['ALL', 'USD', 'EUR', 'AUD', 'GBP', 'CAD', 'JPY'].forEach(c => {
                const btn = document.getElementById(`curr-${c}`);
                if (btn) btn.className = c === curr ? 'py-1 rounded-lg curr-btn-active font-bold' : 'py-1 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg font-bold border border-slate-800';
            });
            renderNews();
        }

        function renderNews() {
            const container = document.getElementById('red-folder-container');
            container.innerHTML = '';
            
            const filtered = redFolderNews.filter(n => {
                const currencyMatch = (activeCurrency === 'ALL' || n.currency === activeCurrency);
                const rangeMatch = matchesTimeRange(n);
                return currencyMatch && rangeMatch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-500 font-mono text-xs border border-dashed border-slate-800 rounded-xl bg-slate-900/40">No Red Folder News Found for Selected Filter</div>`;
                return;
            }

            filtered.forEach(news => {
                const card = document.createElement('div');
                card.className = "bg-slate-950/90 p-3 rounded-xl border border-slate-800 hover:border-cyan-500/40 cursor-pointer transition-all space-y-1.5 shadow-lg";
                card.innerHTML = `
                    <div class="flex justify-between items-start text-xs font-mono">
                        <div class="flex items-center space-x-2">
                            <span class="px-1.5 py-0.5 bg-red-950 text-red-400 rounded-md text-[10px] font-bold border border-red-800">${news.currency}</span>
                            <span class="text-slate-100 font-bold text-xs tracking-wide">${news.event}</span>
                        </div>
                        <span class="bg-amber-950/80 text-amber-400 px-2 py-0.5 rounded-lg text-[10px] font-bold border border-amber-800/50">HIGH IMPACT</span>
                    </div>
                    <div class="flex justify-between items-center text-[11px] font-mono text-slate-400 pt-1 border-t border-slate-900">
                        <span><i class="fa-regular fa-clock text-cyan-400 mr-1"></i> ${news.displayDate} @ ${news.time}</span>
                        <div class="space-x-2">
                            <span>Fcst: <strong class="text-slate-200">${news.forecast}</strong></span>
                            <span>Prev: <strong class="text-amber-400">${news.previous}</strong></span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('live-ist-clock').innerText = `IN LIVE IST: ${now.toLocaleString('en-GB', { timeZone: 'Asia/Kolkata', hour12: true }).replace(',', '')}`;
        }

        window.onload = () => {
            loadTvChart('OANDA:XAUUSD', 'XAUUSD');
            setTimeRange('THIS_WEEK');
            setInterval(updateClock, 1000);
        };
    </script>
</body>
</html>
