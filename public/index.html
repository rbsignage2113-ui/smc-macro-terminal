<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC MACRO PRO TERMINAL — LIVE IST ENGINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="p-3 md:p-5">

    <!-- Top Navigation Header -->
    <header class="flex flex-col md:flex-row justify-between items-center bg-slate-900 border border-slate-800 p-3 rounded-xl mb-4 gap-3">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-black text-white tracking-wide">SMC MACRO PRO TERMINAL</h1>
            <!-- Live IST Clock Box -->
            <div class="px-2.5 py-1 text-xs font-mono font-bold bg-cyan-950 text-cyan-300 border border-cyan-800 rounded flex items-center gap-1.5">
                <span>🇮🇳 LIVE IST:</span>
                <span id="live-ist-clock" class="text-white">--/--/---- --:--:--</span>
            </div>
        </div>
        
        <!-- Live Ticker -->
        <div class="flex gap-4 text-xs font-mono">
            <div><span class="text-slate-400">USDCAD:</span> <span class="text-green-400 font-bold">1.3785</span></div>
            <div><span class="text-slate-400">GBPUSD:</span> <span class="text-red-400 font-bold">1.3040</span></div>
            <div><span class="text-slate-400">USDJPY:</span> <span class="text-green-400 font-bold">149.50</span></div>
            <div><span class="text-slate-400">GOLD:</span> <span class="text-green-400 font-bold">$2,662.80</span></div>
        </div>

        <div class="flex items-center gap-2 text-xs font-bold">
            <span class="px-2 py-1 rounded bg-slate-800 text-slate-400">ASIA</span>
            <span class="px-2 py-1 rounded bg-emerald-950 text-emerald-400 border border-emerald-800 animate-pulse">● LONDON KILLZONE</span>
            <span class="px-2 py-1 rounded bg-slate-800 text-slate-400">NY</span>
        </div>
    </header>

    <!-- Main Terminal Grid Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">

        <!-- Left Column: Live Chart (7 Cols) -->
        <div class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col h-[740px]">
            <div class="flex justify-between items-center mb-2 px-1">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">📊 Institutional Live Chart</span>
                <div class="flex gap-1 text-[11px]">
                    <button class="px-2 py-0.5 bg-yellow-500 text-slate-950 font-bold rounded">USDCAD</button>
                    <button class="px-2 py-0.5 bg-slate-800 text-slate-300 rounded">GBPUSD</button>
                    <button class="px-2 py-0.5 bg-slate-800 text-slate-300 rounded">USDJPY</button>
                    <button class="px-2 py-0.5 bg-slate-800 text-slate-300 rounded">XAUUSD</button>
                </div>
            </div>
            <div class="w-full flex-grow rounded-xl overflow-hidden">
                <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_chart&symbol=FX%3AUSDCAD&interval=15&hidesidetoolbar=0&symboledit=1&saveimage=1&toolbarbg=f1f3f6&studies=%5B%5D&theme=dark&style=1&timezone=Asia%2FKolkata" class="w-full h-full border-0"></iframe>
            </div>
        </div>

        <!-- Right Column: Multi-Currency Parent Desk (5 Cols) -->
        <div class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col h-[740px] overflow-hidden">
            
            <!-- Desk Header & Date Filters -->
            <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <span class="text-red-500">🚨</span>
                    <h2 class="text-xs font-bold text-slate-200 uppercase tracking-wider">FOREX FACTORY RED FOLDER DESK</h2>
                </div>

                <div class="flex gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800 text-[11px] font-bold">
                    <button onclick="loadNews('today')" id="btn-today" class="px-2 py-1 rounded bg-yellow-500 text-slate-950 transition">TODAY</button>
                    <button onclick="loadNews('this_week')" id="btn-this_week" class="px-2 py-1 rounded text-slate-400 hover:text-white transition">THIS WEEK</button>
                    <button onclick="loadNews('this_month')" id="btn-this_month" class="px-2 py-1 rounded text-slate-400 hover:text-white transition">THIS MONTH</button>
                </div>
            </div>

            <!-- Currency Selectors Row -->
            <div class="flex gap-1.5 mb-3 overflow-x-auto pb-1 text-[11px] font-bold">
                <button onclick="filterCurrency('ALL')" id="curr-ALL" class="px-2.5 py-1 rounded bg-red-600 text-white border border-red-500">ALL</button>
                <button onclick="filterCurrency('USD')" id="curr-USD" class="px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700">USD</button>
                <button onclick="filterCurrency('EUR')" id="curr-EUR" class="px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700">EUR</button>
                <button onclick="filterCurrency('CAD')" id="curr-CAD" class="px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700">CAD</button>
                <button onclick="filterCurrency('AUD')" id="curr-AUD" class="px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700">AUD</button>
                <button onclick="filterCurrency('GBP')" id="curr-GBP" class="px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700">GBP</button>
                <button onclick="filterCurrency('JPY')" id="curr-JPY" class="px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700">JPY</button>
            </div>

            <!-- Dynamic News Cards Container -->
            <div id="news-desk-container" class="space-y-3 overflow-y-auto pr-1 flex-grow">
                <div class="text-center py-10 text-slate-500 text-xs">Connecting Live Forex Factory Engine...</div>
            </div>

        </div>

    </div>

    <script>
        let activeRange = 'today';
        let selectedCurrency = 'ALL';
        let cachedNewsData = null;
        let countdownInterval = null;

        // Live IST Clock Engine
        function startLiveISTClock() {
            setInterval(() => {
                const now = new Date();
                const options = { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
                document.getElementById('live-ist-clock').innerText = new Intl.DateTimeFormat('en-IN', options).format(now);
            }, 1000);
        }

        function setRangeUI(range) {
            activeRange = range;
            ['today', 'this_week', 'this_month'].forEach(r => {
                const btn = document.getElementById(`btn-${r}`);
                if (btn) {
                    btn.className = (r === range) ? 
                        "px-2 py-1 rounded bg-yellow-500 text-slate-950 transition font-bold" : 
                        "px-2 py-1 rounded text-slate-400 hover:text-white transition font-bold";
                }
            });
        }

        function filterCurrency(curr) {
            selectedCurrency = curr;
            ['ALL', 'USD', 'EUR', 'CAD', 'AUD', 'GBP', 'JPY'].forEach(c => {
                const btn = document.getElementById(`curr-${c}`);
                if (btn) {
                    btn.className = (c === curr) ? 
                        "px-2.5 py-1 rounded bg-red-600 text-white border border-red-500 font-bold" : 
                        "px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold";
                }
            });
            if (cachedNewsData) renderNewsUI(cachedNewsData);
        }

        async function loadNews(range) {
            setRangeUI(range);
            const container = document.getElementById('news-desk-container');
            container.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">Analyzing ${range.replace('_', ' ').toUpperCase()} Forex Factory Data...</div>`;

            try {
                const res = await fetch(`/api/news-ai-bias?range=${range}`);
                cachedNewsData = await res.json();
                renderNewsUI(cachedNewsData);
            } catch (err) {
                console.error("UI Load Error:", err);
                container.innerHTML = `<div class="text-center py-10 text-red-400 text-xs">Failed to fetch AI news engine.</div>`;
            }
        }

        function renderNewsUI(data) {
            const container = document.getElementById('news-desk-container');
            container.innerHTML = '';

            const rawEvents = data.raw_news || [];
            const aiBias = data.ai_bias || {};

            const filteredEvents = rawEvents.filter(item => {
                const curr = item.currency;
                return selectedCurrency === 'ALL' || selectedCurrency === curr;
            });

            if (filteredEvents.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">No active High Impact Red Folder news scheduled for ${selectedCurrency} in ${activeRange.replace('_', ' ').toUpperCase()}.</div>`;
                return;
            }

            // Group events by Date & Currency
            const groupedByDateCurrency = {};
            filteredEvents.forEach(ev => {
                const key = `${ev.dayFormatted}_${ev.currency}`;
                if (!groupedByDateCurrency[key]) groupedByDateCurrency[key] = [];
                groupedByDateCurrency[key].push(ev);
            });

            if (countdownInterval) clearInterval(countdownInterval);

            Object.keys(groupedByDateCurrency).forEach(key => {
                const events = groupedByDateCurrency[key];
                const curr = events[0].currency;
                const dayStr = events[0].dayFormatted;

                const aiInfo = aiBias[curr] || {
                    bias: "BULLISH",
                    confidence: "55%",
                    ict_note: "Awaiting verified directional liquidity sweeps."
                };

                const badgeColor = aiInfo.bias === 'BULLISH' ? 'bg-green-500/20 text-green-400 border-green-500' : 
                                  (aiInfo.bias === 'BEARISH' ? 'bg-red-500/20 text-red-400 border-red-500' : 'bg-yellow-500/20 text-yellow-400 border-yellow-500');

                let eventsHTML = '';
                events.forEach(ev => {
                    eventsHTML += `
                        <div class="p-2 bg-slate-900/80 rounded-lg border border-slate-800 space-y-1">
                            <div class="flex justify-between items-center text-xs">
                                <span class="font-bold text-slate-200">[${curr}] ${ev.event}</span>
                                <span class="text-[10px] font-bold text-cyan-400 font-mono flex items-center gap-1">
                                    ⏳ <span class="countdown-timer" data-target="${ev.isoTarget}">Calculating...</span>
                                </span>
                            </div>
                            <div class="flex justify-between items-center text-[10px] text-slate-400">
                                <span>PREV: <strong class="text-slate-200">${ev.prev || '-'}</strong> | FC: <strong class="text-slate-200">${ev.forecast || '-'}</strong></span>
                                <div class="flex items-center gap-2">
                                    <span class="text-yellow-400 font-bold">⏰ ${ev.timeFormatted}</span>
                                    <span class="font-bold text-emerald-400 bg-emerald-950/60 px-1.5 py-0.5 rounded border border-emerald-800">ACT: ${ev.actual || '-'}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2">
                        <div class="flex justify-between items-center border-b border-slate-900 pb-1.5">
                            <span class="text-xs font-black text-red-400 bg-red-950/40 px-2 py-0.5 rounded border border-red-800">${curr} HIGH IMPACT (${events.length} EVENTS)</span>
                            <span class="text-[10px] text-slate-300 font-bold bg-slate-900 px-2 py-0.5 rounded border border-slate-800">📅 ${dayStr}</span>
                        </div>

                        <div class="space-y-1">
                            ${eventsHTML}
                        </div>

                        <div class="p-2.5 bg-slate-900 rounded-lg border-l-4 border-yellow-500 space-y-1">
                            <div class="flex justify-between items-center">
                                <span class="text-[11px] font-bold text-yellow-400">🧠 OVERALL ${curr} COMBINED AI SIGNAL:</span>
                                <span class="text-[10px] font-black px-2 py-0.5 rounded border ${badgeColor}">${aiInfo.bias} (${aiInfo.confidence})</span>
                            </div>
                            <p class="text-[11px] text-slate-300 leading-snug">${aiInfo.ict_note}</p>
                        </div>
                    </div>
                `;
            });

            startLiveCountdowns();
        }

        function startLiveCountdowns() {
            countdownInterval = setInterval(() => {
                document.querySelectorAll('.countdown-timer').forEach(el => {
                    const target = new Date(el.getAttribute('data-target')).getTime();
                    const now = new Date().getTime();
                    const diff = target - now;

                    if (diff <= 0) {
                        el.innerText = "LIVE EXECUTING";
                        el.className = "text-emerald-400 font-bold animate-pulse";
                    } else {
                        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                        const hrs = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        const secs = Math.floor((diff % (1000 * 60)) / 1000);

                        if (days > 0) {
                            el.innerText = `In ${days}d ${String(hrs).padStart(2, '0')}h ${String(mins).padStart(2, '0')}m`;
                        } else {
                            el.innerText = `In ${String(hrs).padStart(2, '0')}h ${String(mins).padStart(2, '0')}m ${String(secs).padStart(2, '0')}s`;
                        }
                    }
                });
            }, 1000);
        }

        startLiveISTClock();
        loadNews('today');
    </script>
</body>
</html>
